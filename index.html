<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zinova Healthcare – Innovation in Every Dose</title>
  <link rel="stylesheet" href="assets/zinova.css">
</head>
<body>

  <!-- Header Section -->
  <header class="zh-header">
    <div class="zh-container zh-header__main">
      <a href="/" class="zh-logo">
        <img src="assets/zinova-logo.png" alt="Zinova Healthcare Logo">
        <span class="zh-logo__tagline">Innovation in Every Dose</span>
      </a>

      <div class="zh-search">
        <input type="text" placeholder="Search medicines, brands, categories..." class="zh-search__input">
        <button class="zh-search__btn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>

      <div class="zh-header__actions">
        <a href="#" class="zh-action-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Account</span>
        </a>
        <a href="#" class="zh-action-item zh-cart">
          <div class="zh-cart__icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
            <span class="zh-cart__badge">1</span>
          </div>
          <span>Cart</span>
        </a>
      </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="zh-nav">
      <div class="zh-container">
        <ul class="zh-nav__list">
          <li><a href="#" class="active">Home</a></li>
          <li><a href="#">Catalog</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main>
    <!-- Hero Section -->
    <section class="zh-hero">
      <div class="zh-container zh-hero__grid">
        <div class="zh-hero__text">
          <h1>Trusted Healthcare,<br><span class="highlight">Delivered With Care.</span></h1>
          <p>Genuine healthcare products from Zinova, making quality healthcare more accessible and convenient.</p>
          <div class="zh-hero__buttons">
            <a href="#" class="zh-btn zh-btn--primary">Shop All &rarr;</a>
            <a href="#" class="zh-btn zh-btn--outline">Explore Products</a>
          </div>
        </div>
        <div class="zh-hero__media">
          <div class="zh-hero__card">
            <img src="assets/zinova-hero.jpg" alt="Zinova Healthcare Products">
          </div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
