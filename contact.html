<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us – Zinova Healthcare</title>
  <link rel="icon" type="image/png" href="assets/zinova-mark.png">
  <link rel="stylesheet" href="assets/zinova.css">
</head>
<body>

  <header class="zh-header">
    <div class="zh-container zh-header__main">
      <a href="index.html" class="zh-logo">
        <img src="assets/zinova-logo.png" alt="Zinova Healthcare">
      </a>
      <nav class="zh-nav">
        <ul class="zh-nav__list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="divisions.html">Divisions</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="quality.html">Quality Assurance</a></li>
          <li><a href="contact.html" class="active">Contact Us</a></li>
        </ul>
      </nav>
      <a href="contact.html" class="zh-btn zh-btn--primary">Inquire Now</a>
    </div>
  </header>

  <main class="zh-section">
    <div class="zh-container">
      <h1 class="zh-section-title zh-text-center">Get in Touch</h1>
      <div class="zh-contact-wrapper">
        <form class="zh-contact-form" action="#" method="POST" data-netlify="true">
          <div class="zh-form-group">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
          </div>
          <div class="zh-form-group">
            <input type="text" name="phone" placeholder="Phone Number">
            <input type="text" name="subject" placeholder="Subject">
          </div>
          <textarea name="message" placeholder="Your Inquiry or Message..." rows="5" required></textarea>
          <button type="submit" class="zh-btn zh-btn--primary">Send Inquiry</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="zh-footer">
    <div class="zh-container zh-footer__bottom">
      <p>&copy; 2026 Zinova Healthcare. All Rights Reserved.</p>
    </div>
  </footer>

</body>
</html>
