media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: pages
    label: Site Pages
    type: collection
    files:
      - name: home
        label: Home Page
        path: index.html
        fields:
          - { name: hero_title, label: Hero Title, type: string }
          - { name: hero_subtitle, label: Hero Subtitle, type: text }

      - name: contact
        label: Contact Page
        path: contact.html
        fields:
          - { name: phone, label: Phone Number, type: string }
          - { name: email, label: Email Address, type: string }
- name: products
    label: Products
    type: collection
    path: content/products # Folder where product data files will be stored
    format: json
    fields:
      - { name: title, label: Product Name, type: string }
      - { name: price, label: Price, type: string }
      - { name: image, label: Product Image, type: image }
      - { name: description, label: Description, type: rich-text }
- name: products
    label: Products
    type: collection
    path: content/products # Folder where product data files will be stored
    format: json
    fields:
      - { name: title, label: Product Name, type: string }
