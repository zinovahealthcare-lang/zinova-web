media:
  input: assets
  output: /assets

content:
  - name: home_doctor_image
    label: Chairman / Doctor Image
    type: file
    path: content/chairman.json
    fields:
      - { name: image, label: Select or Upload Doctor Image, type: image }

  - name: products
    label: Products
    type: collection
    path: content/products
    filename: '{{slug}}.json'
    format: json
    fields:
      - { name: title, label: Title, type: string }
      - { name: price, label: Price (PKR / USD), type: string }
      - { name: image, label: Image, type: image }
      - { name: description, label: Description, type: text }
