media:
  input: assets/uploads
  output: /assets/uploads

content:
      - name: contact
        label: Contact Page
        type: file
        path: contact.html
        fields:
          - { name: phone, label: Phone Number, type: string }
          - { name: email, label: Email Address, type: string }

  - name: products
    label: Products
    type: file
    path: content/products.json
    list: true
    fields:
      - { name: title, label: Product Name, type: string }
      - { name: price, label: Price, type: string }
      - { name: image, label: Product Image, type: image }
      - { name: description, label: Description, type: rich-text }
