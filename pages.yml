media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: pages
    label: Site Pages
    type: collection
    files:
      - name: home
        label: Home Page
        path: index.html
        fields:
          - { name: hero_title, label: Hero Title, type: string }
          - { name: hero_subtitle, label: Hero Subtitle, type: text }

      - name: contact
        label: Contact Page
        path: contact.html
        fields:
          - { name: phone, label: Phone Number, type: string }
          - { name: email, label: Email Address, type: string }
