  <!-- Dynamic Product Loader Script -->
  <script>
    async function fetchCMSProducts() {
      const grid = document.querySelector('.zh-products-grid');
      const owner = 'zinovahealthcare-lang';
      const repo = 'zinova-web';
      const folderPath = 'content/products';

      try {
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folderPath}`);
        if (!response.ok) return;

        const files = await response.json();
        const jsonFiles = files.filter(file => file.name.endsWith('.json'));

        if (jsonFiles.length === 0) return;

        const productFetches = jsonFiles.map(file => fetch(file.download_url).then(res => res.json()));
        const products = await Promise.all(productFetches);

        grid.innerHTML = ''; // Clear fallback items when CMS items exist

        products.forEach(product => {
          const card = document.createElement('div');
          card.className = 'zh-product-card';
          
          const imgSrc = product.image ? product.image : 'assets/zinova-mark.png';
          const categoryOrPrice = product.description || (product.price ? `PKR ${product.price}` : '');

          card.innerHTML = `
            <div class="zh-product-card__img">
              <img src="${imgSrc}" alt="${product.title || 'Product'}">
            </div>
            <h4>${product.title || 'Untitled Product'}</h4>
            <span class="zh-product-cat">${categoryOrPrice}</span>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        console.warn('Loading fallback products list:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', fetchCMSProducts);
  </script>
